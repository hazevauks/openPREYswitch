# Meson cross file for the Nintendo Switch (devkitPro devkitA64 + libnx).
#
# Use from the devkitPro MSYS2 shell (DEVKITPRO=/opt/devkitpro):
#   meson setup builddir-switch --cross-file tools/switch/meson/switch-cross.ini
#
# Flags mirror the libnx homebrew template ($DEVKITPRO/libnx/switch_rules).

[constants]
dkp = '/opt/devkitpro'
toolchain = dkp / 'devkitA64/bin/aarch64-none-elf-'
arch = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIE']
includes = ['-I' + dkp / 'libnx/include', '-I' + dkp / 'portlibs/switch/include']
libdirs = ['-L' + dkp / 'libnx/lib', '-L' + dkp / 'portlibs/switch/lib']

[binaries]
c = toolchain + 'gcc'
cpp = toolchain + 'g++'
ar = toolchain + 'gcc-ar'
strip = toolchain + 'strip'
objcopy = toolchain + 'objcopy'
pkg-config = dkp / 'portlibs/switch/bin/aarch64-none-elf-pkg-config'

[host_machine]
system = 'horizon'
cpu_family = 'aarch64'
cpu = 'cortex-a57'
endian = 'little'

[built-in options]
# Frame pointers keep the crash handler's backtrace (src/sys/switch/switch_main.cpp) reliable.
c_args = arch + includes + ['-D__SWITCH__', '-ffunction-sections', '-fno-omit-frame-pointer']
cpp_args = arch + includes + ['-D__SWITCH__', '-ffunction-sections', '-fno-omit-frame-pointer']
c_link_args = arch + libdirs + ['-specs=' + dkp / 'libnx/switch.specs', '-lnx']
cpp_link_args = arch + libdirs + ['-specs=' + dkp / 'libnx/switch.specs', '-lnx']
default_library = 'static'
b_staticpic = true
